services:
    mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        environment:
            MYSQL_ROOT_PASSWORD: ${QUALIFY_ROOT_PASSWORD:?}
            MYSQL_DATABASE: ticket107_qualification
            MYSQL_USER: qualification
            MYSQL_PASSWORD: ${DB_PASSWORD:?}
        command: ['--innodb-buffer-pool-size=2G', '--max-connections=100']
        volumes:
            - mysql:/var/lib/mysql
        mem_limit: 4g
        cpus: 6
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "MYSQL_PWD=$$MYSQL_PASSWORD mysql -uqualification ticket107_qualification -e 'select 1'",
                ]
            interval: 2s
            timeout: 5s
            retries: 90
        networks: [qualification]
    php:
        build:
            context: .
            args:
                HOST_UID: ${HOST_UID:?}
                HOST_GID: ${HOST_GID:?}
        env_file: ${QUALIFY_ENV_FILE:?}
        volumes:
            - ${QUALIFY_ROOT:?}:/app:ro
            - ${QUALIFY_ROOT:?}/storage:/app/storage
            - ${QUALIFY_ROOT:?}/bootstrap/cache:/app/bootstrap/cache
            - ${QUALIFY_ROOT:?}/.scratch:/app/.scratch
        depends_on:
            mysql:
                condition: service_healthy
        mem_limit: 2g
        cpus: 2
        networks: [qualification]
    nginx:
        image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
        ports: ['127.0.0.1::80']
        volumes:
            - ${QUALIFY_ROOT:?}/public:/app/public:ro
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on: [php]
        mem_limit: 128m
        cpus: 0.5
        networks: [qualification, edge]
networks:
    qualification:
        internal: true
    edge:
volumes:
    mysql:
